name: Boatrace AI Daily

on:
  schedule:
    - cron: '13 21 * * *'   # morning (6:13 JST)。2026-10-30: 毎時0分・30分は混み3〜6時間遅れていた（7:30→10:52）ので外す
    - cron: '13 4 * * *'    # midday (13:13 JST)
    - cron: '47 12 * * *'   # evening (21:47 JST)
    - cron: '0 15 * * 0'    # weekly report (Sunday 0:00 JST)
    - cron: '0 18 * * 6'    # weekly train (Saturday 3:00 JST)
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - morning
          - midday
          - evening
          - weekly-report
          - train
          - preview

env:
  # 2026-10-30: date.today() を日本の日付にする（UTC のままだと 9時前の実行が前日扱いになる）
  TZ: Asia/Tokyo
  BOATRACE_DB_PATH: ${{ github.workspace }}/.boatrace-data/boatrace.db
  BOATRACE_MODEL_PATH: ${{ github.workspace }}/.boatrace-data/model.lgb
  BOATRACE_EV_MIN: '0.30'

jobs:
  morning:
    if: >-
      github.event.schedule == '13 21 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[ml]"
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}
          restore-keys: boatrace-data-

      - name: Ensure data directory
        run: mkdir -p .boatrace-data

      - name: Predict today
        env:
          BOATRACE_SKIP_ODDS: '1'
        run: boatrace predict today --mode ml

      - name: Publish grades to note.com
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace publish grades

      - name: Cool-down before premium
        run: sleep $(shuf -i 60-180 -n 1)

      - name: Publish S-rank paid articles
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace publish premium
        timeout-minutes: 20
        continue-on-error: true

      - name: Tweet morning prediction
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: boatrace tweet morning
        continue-on-error: true

      - name: Follow note.com creators
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace engage note-follow --max 5
        continue-on-error: true

      - name: Like note.com articles (suki)
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace engage note-suki --max 30
        continue-on-error: true

      - name: Engage with community (morning)
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: boatrace engage auto --timing morning
        continue-on-error: true

      - name: Save data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}-morning

  midday:
    if: >-
      github.event.schedule == '13 4 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'midday')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[ml]"
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}
          restore-keys: boatrace-data-

      - name: Ensure data directory
        run: mkdir -p .boatrace-data

      - name: Race date
        # 2026-10-30: 夜の実行が日付をまたいで遅れても、その日のレースを答え合わせする（6時間前の日付）。朝の記事の「今夜の答え合わせ」と合わせる
        run: echo "RACE_DATE=$(date -d '-6 hours' +%F)" >> "$GITHUB_ENV"

      - name: Fetch results
        run: boatrace results fetch "$RACE_DATE"

      - name: Check results
        run: boatrace results check

      - name: Check ROI
        run: boatrace roi check

      - name: Publish midday report
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace publish midday

      - name: Tweet midday report
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: boatrace tweet midday
        continue-on-error: true

      - name: Save data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}-midday

  evening:
    if: >-
      github.event.schedule == '47 12 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'evening')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[ml]"
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}
          restore-keys: boatrace-data-

      - name: Ensure data directory
        run: mkdir -p .boatrace-data

      - name: Race date
        # 2026-10-30: 夜の実行が日付をまたいで遅れても、その日のレースを答え合わせする（6時間前の日付）。朝の記事の「今夜の答え合わせ」と合わせる
        run: echo "RACE_DATE=$(date -d '-6 hours' +%F)" >> "$GITHUB_ENV"

      - name: Fetch results
        run: boatrace results fetch "$RACE_DATE"

      - name: Check results
        run: boatrace results check

      - name: Check ROI
        run: boatrace roi check

      - name: ROI today
        run: boatrace roi today

      - name: Publish results to note.com
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace publish results "$RACE_DATE"

      - name: Cool-down before hit flash
        run: sleep $(shuf -i 60-180 -n 1)

      - name: Publish hit flash (if big win)
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace publish hit-flash "$RACE_DATE" --min-payout 5000
        continue-on-error: true

      - name: Tweet hit announcements
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: boatrace tweet hit
        continue-on-error: true

      - name: Tweet daily summary
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: boatrace tweet daily
        continue-on-error: true

      - name: Engage with community (evening)
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: boatrace engage auto --timing evening
        continue-on-error: true

      - name: Save data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}-evening

  weekly-report:
    if: >-
      github.event.schedule == '0 15 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'weekly-report')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[ml]"
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}
          restore-keys: boatrace-data-

      - name: Ensure data directory
        run: mkdir -p .boatrace-data

      - name: Publish track record
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace publish track-record

      - name: Publish weekly premium report
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace publish weekly-premium

      # 2026-10-29 本人「事実の判断材料の記事を足す」: 場ごとの1号艇の勝ちやすさ（直近90日・週1回）
      - name: Publish venue facts
        continue-on-error: true
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_USER_ID: ${{ secrets.NOTE_USER_ID }}
          NOTE_SESSION_COOKIES: ${{ secrets.NOTE_SESSION_COOKIES }}
        run: boatrace publish venues

      - name: Save data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}-weekly-report

  weekly-train:
    if: >-
      github.event.schedule == '0 18 * * 6' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'train')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[ml]"

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}
          restore-keys: boatrace-data-

      - name: Ensure data directory
        run: mkdir -p .boatrace-data

      - name: Train model
        run: boatrace train --days 365

      - name: Save data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}-train

  # 2026-10-30: 記事の改善版を、本番のデータで投稿せずに作る（note-score-20261030 の採点用）。キャッシュは保存しない＝本番の DB を変えない
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[ml]"
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .boatrace-data
          key: boatrace-data-${{ github.run_id }}
          restore-keys: boatrace-data-

      - name: Preview articles (no publish)
        continue-on-error: true
        # 前日分で作る（当日は朝の実行前だと予想が無い。前日なら朝・昼・夜の全部がそろう）
        run: |
          Y=$(date -d '-1 day' +%F)
          boatrace publish grades "$Y" --dry-run
          boatrace publish premium "$Y" --dry-run
          boatrace publish results "$Y" --dry-run
          boatrace publish midday "$Y" --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: rin-preview
          path: ~/.boatrace-ai/preview
          if-no-files-found: warn
